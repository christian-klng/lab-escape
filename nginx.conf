server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json application/wasm model/gltf-binary image/svg+xml;
  gzip_min_length 1024;

  # Healthcheck für Docker/Coolify
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Gehashte Build-Dateien und 3D-Assets lange cachen (Dateinamen ändern sich bei jedem Build)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html nie cachen, damit neue Versionen sofort ankommen
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
